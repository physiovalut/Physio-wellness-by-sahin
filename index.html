<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr Sahin Ahamed Laskar (P.T) | Physio Wellness</title>

<meta name="description" content="Professional physiotherapy and rehabilitation care by Dr Sahin Ahamed Laskar (P.T) in Joynagar, Baruipur, West Bengal.">
<meta name="theme-color" content="#087f8c">

<meta property="og:title" content="Dr Sahin Ahamed Laskar (P.T) | Physio Wellness">
<meta property="og:description" content="Personalized physiotherapy and rehabilitation care.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --ink:#102a43;
  --ink2:#193b56;
  --teal:#087f8c;
  --teal2:#0eaaa5;
  --mint:#e8f8f7;
  --cream:#f5faf9;
  --white:#ffffff;
  --muted:#718096;
  --line:#e3eeee;
  --danger:#c62828;
  --success:#087f8c;

  --shadow-sm:0 10px 30px rgba(16,42,67,.06);
  --shadow:0 25px 80px rgba(16,42,67,.10);
  --shadow-lg:0 35px 100px rgba(16,42,67,.15);

  --radius:24px;
}

body.dark{
  --ink:#edfafa;
  --ink2:#d5eeee;
  --teal:#31c6c0;
  --teal2:#54ddd5;
  --mint:#12383a;
  --cream:#081b25;
  --white:#0d2531;
  --muted:#9ab0b8;
  --line:#1c3b46;
  --shadow:0 25px 80px rgba(0,0,0,.28);
  background:#071923;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

html{
  scroll-padding-top:100px;
}

body{
  font-family:"DM Sans",sans-serif;
  color:var(--ink);
  background:#fff;
  line-height:1.7;
  transition:background .35s,color .35s;
}

body.dark{
  background:#071923;
}

h1,h2,h3,h4{
  font-family:"Manrope",sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

.container{
  width:min(1180px,90%);
  margin:auto;
}

/* ================= SCROLL PROGRESS ================= */

.progress-bar{
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:3px;
  background:linear-gradient(90deg,var(--teal),var(--teal2));
  z-index:3000;
}

/* ================= NAV ================= */

nav{
  position:fixed;
  z-index:2000;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(1180px,94%);
  padding:10px 12px 10px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border:1px solid rgba(255,255,255,.65);
  border-radius:20px;

  background:rgba(255,255,255,.86);
  backdrop-filter:blur(22px);

  box-shadow:0 15px 50px rgba(16,42,67,.09);

  transition:.3s;
}

body.dark nav{
  background:rgba(9,31,42,.88);
  border-color:rgba(255,255,255,.08);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  font-family:"Manrope",sans-serif;
  font-weight:800;
  font-size:16px;
  color:var(--ink);
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:14px;

  display:grid;
  place-items:center;

  color:#fff;
  background:linear-gradient(135deg,var(--ink),var(--teal));

  box-shadow:0 8px 22px rgba(8,127,140,.18);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:3px;
}

.nav-links a{
  padding:10px 13px;
  border-radius:10px;

  color:#526777;
  font-size:13px;
  font-weight:700;

  transition:.25s;
}

body.dark .nav-links a{
  color:#b6cbd0;
}

.nav-links a:hover{
  color:var(--teal);
  background:var(--mint);
}

.nav-book{
  color:#fff!important;
  background:var(--teal)!important;
  border-radius:30px!important;
  padding:11px 17px!important;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.theme-btn,
.menu-btn{
  width:42px;
  height:42px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--white);
  color:var(--ink);

  cursor:pointer;
  display:grid;
  place-items:center;

  font-size:18px;
}

.menu-btn{
  display:none;
}

/* ================= HERO ================= */

.hero{
  min-height:100vh;

  display:grid;
  grid-template-columns:1.08fr .92fr;
  align-items:center;

  gap:50px;

  padding:150px 6% 100px;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 85% 18%,rgba(14,170,165,.16),transparent 28%),
    radial-gradient(circle at 12% 85%,rgba(8,127,140,.08),transparent 30%),
    linear-gradient(180deg,#f8fcfb,#ffffff);
}

body.dark .hero{
  background:
    radial-gradient(circle at 85% 18%,rgba(14,170,165,.13),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(8,127,140,.09),transparent 30%),
    #071923;
}

.hero-grid{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(rgba(8,127,140,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(8,127,140,.035) 1px,transparent 1px);

  background-size:55px 55px;

  mask-image:linear-gradient(to bottom,black,transparent);
  pointer-events:none;
}

.hero-content{
  max-width:700px;
  position:relative;
  z-index:2;
}

.hero-label{
  display:inline-flex;
  align-items:center;
  gap:9px;

  padding:8px 14px;

  border:1px solid rgba(8,127,140,.10);
  border-radius:40px;

  background:var(--mint);
  color:var(--teal);

  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;

  margin-bottom:23px;
}

.hero-label i{
  width:7px;
  height:7px;

  border-radius:50%;
  background:#13a77f;

  box-shadow:0 0 0 5px rgba(19,167,127,.10);
}

.hero h1{
  font-size:clamp(48px,6.3vw,82px);
  line-height:1.02;
  letter-spacing:-4px;

  margin-bottom:25px;
}

.hero h1 span{
  color:var(--teal);
}

.hero-description{
  max-width:620px;

  color:#607486;
  font-size:18px;

  margin-bottom:32px;
}

body.dark .hero-description{
  color:#9bb1b9;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  padding:15px 23px;

  border-radius:14px;

  font-size:14px;
  font-weight:800;

  transition:.3s;
}

.btn-primary{
  color:#fff;
  background:linear-gradient(135deg,var(--teal),var(--teal2));

  box-shadow:0 14px 35px rgba(8,127,140,.22);
}

.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 42px rgba(8,127,140,.28);
}

.btn-outline{
  color:var(--ink);
  background:var(--white);
  border:1px solid var(--line);
}

.btn-outline:hover{
  color:var(--teal);
  border-color:var(--teal);
  transform:translateY(-3px);
}

/* HERO VISUAL */

.hero-art{
  position:relative;
  min-height:520px;

  display:grid;
  place-items:center;
}

.art-glow{
  position:absolute;
  width:420px;
  height:420px;

  border-radius:50%;

  background:radial-gradient(circle,rgba(8,127,140,.18),transparent 68%);

  filter:blur(8px);
}

.art-circle{
  width:410px;
  height:410px;

  border-radius:50%;

  position:relative;

  background:
    radial-gradient(circle at 35% 25%,#ffffff,transparent 25%),
    linear-gradient(145deg,#d9f5f3,#f8ffff);

  box-shadow:
    inset 0 0 0 1px rgba(8,127,140,.08),
    0 35px 90px rgba(8,127,140,.13);
}

body.dark .art-circle{
  background:
    radial-gradient(circle at 35% 25%,rgba(255,255,255,.08),transparent 25%),
    linear-gradient(145deg,#12383a,#0d2531);
}

.art-circle:before{
  content:"";

  position:absolute;
  inset:45px;

  border:1px solid rgba(8,127,140,.15);
  border-radius:50%;
}

.art-circle:after{
  content:"";

  position:absolute;
  inset:88px;

  border-radius:50%;

  background:rgba(8,127,140,.06);
}

.body-line{
  position:absolute;

  left:50%;
  top:51%;

  transform:translate(-50%,-50%);

  width:96px;
  height:230px;

  border:7px solid var(--teal);
  border-radius:55px 55px 35px 35px;

  opacity:.85;
}

.body-line:before{
  content:"";

  position:absolute;

  width:55px;
  height:55px;

  border:7px solid var(--teal);
  border-radius:50%;

  left:50%;
  top:-70px;

  transform:translateX(-50%);
}

.body-line:after{
  content:"";

  position:absolute;

  width:200px;
  height:7px;

  background:var(--teal);
  border-radius:10px;

  left:50%;
  top:68px;

  transform:translateX(-50%);
}

.floating{
  position:absolute;

  padding:16px 20px;

  background:var(--white);
  border:1px solid var(--line);

  border-radius:18px;

  box-shadow:0 18px 45px rgba(16,42,67,.10);

  font-size:12px;
  font-weight:700;

  z-index:5;

  animation:float 4s ease-in-out infinite;
}

.floating strong{
  display:block;

  color:var(--teal);

  font-family:"Manrope",sans-serif;
  font-size:21px;
}

.float-a{
  left:-5px;
  top:80px;
}

.float-b{
  right:-5px;
  bottom:75px;
  animation-delay:1s;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* ================= TRUST ================= */

.trust{
  margin-top:-40px;
  position:relative;
  z-index:20;
}

.trust-box{
  width:min(1080px,88%);
  margin:auto;

  padding:27px;

  background:var(--white);
  border:1px solid var(--line);

  border-radius:24px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  box-shadow:var(--shadow);
}

.trust-item{
  text-align:center;
  padding:4px 15px;
}

.trust-item:not(:last-child){
  border-right:1px solid var(--line);
}

.trust-item strong{
  display:block;

  font-family:"Manrope",sans-serif;
  font-size:19px;
}

.trust-item span{
  color:var(--muted);
  font-size:12px;
}

/* ================= GENERAL ================= */

section{
  padding:115px 6%;
}

.section-head{
  max-width:700px;
  margin:0 auto 55px;
  text-align:center;
}

.kicker{
  color:var(--teal);

  font-size:11px;
  font-weight:800;

  letter-spacing:2px;
  text-transform:uppercase;

  margin-bottom:11px;
}

.section-head h2{
  font-size:clamp(34px,4vw,52px);
  line-height:1.1;
  letter-spacing:-2px;

  margin-bottom:14px;
}

.section-head p{
  color:var(--muted);
}

/* ================= ABOUT ================= */

.about{
  background:var(--white);
}

.about-grid{
  max-width:1100px;
  margin:auto;

  display:grid;
  grid-template-columns:.82fr 1.18fr;

  gap:70px;

  align-items:center;
}

.profile-card{
  min-height:420px;

  padding:38px;

  border-radius:34px;

  color:#fff;

  background:
    radial-gradient(circle at 90% 10%,rgba(255,255,255,.15),transparent 25%),
    linear-gradient(145deg,#102a43,#087f8c);

  position:relative;
  overflow:hidden;

  box-shadow:0 30px 75px rgba(16,42,67,.18);
}

.profile-card:before,
.profile-card:after{
  content:"";

  position:absolute;

  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;
}

.profile-card:before{
  width:340px;
  height:340px;

  right:-170px;
  bottom:-140px;
}

.profile-card:after{
  width:210px;
  height:210px;

  right:-100px;
  bottom:-65px;
}

.profile-mark{
  width:76px;
  height:76px;

  display:grid;
  place-items:center;

  border-radius:23px;

  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);

  font-size:34px;

  margin-bottom:115px;
}

.profile-card h3{
  font-size:25px;
  line-height:1.25;

  margin-bottom:8px;

  position:relative;
  z-index:2;
}

.profile-card p{
  color:rgba(255,255,255,.70);

  font-size:13px;

  position:relative;
  z-index:2;
}

.about-content h3{
  font-size:31px;
  margin-bottom:4px;
}

.qualification{
  color:var(--teal);
  font-weight:800;
  margin-bottom:20px;
}

.about-content p{
  color:var(--muted);
  margin-bottom:16px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;

  margin-top:27px;
}

.feature{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:13px;
  font-weight:700;
}

.feature-dot{
  width:26px;
  height:26px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--mint);
  color:var(--teal);
}

/* ================= SERVICES ================= */

.services-section{
  background:var(--cream);
}

.services{
  max-width:1140px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.service{
  background:var(--white);

  border:1px solid var(--line);
  border-radius:26px;

  padding:31px;

  position:relative;
  overflow:hidden;

  transition:.35s;
}

.service:after{
  content:"";

  position:absolute;

  width:130px;
  height:130px;

  border-radius:50%;

  right:-70px;
  bottom:-70px;

  background:var(--mint);

  opacity:.55;
}

.service:hover{
  transform:translateY(-9px);
  box-shadow:var(--shadow);
  border-color:rgba(8,127,140,.25);
}

.service-number{
  position:absolute;

  top:19px;
  right:22px;

  color:#e2eeee;

  font-family:"Manrope",sans-serif;
  font-size:34px;
  font-weight:800;
}

body.dark .service-number{
  color:#193a42;
}

.service-icon{
  width:54px;
  height:54px;

  display:grid;
  place-items:center;

  border-radius:16px;

  background:var(--mint);

  margin-bottom:25px;
}

.service-icon:before{
  content:"";

  width:19px;
  height:19px;

  border:3px solid var(--teal);
  border-radius:50%;
}

.service h3{
  font-size:18px;
  margin-bottom:9px;
}

.service p{
  color:var(--muted);
  font-size:13px;
}

/* ================= PROCESS ================= */

.process{
  background:var(--white);
}

.process-grid{
  max-width:1050px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:20px;
}

.process-card{
  text-align:center;
  padding:32px 22px;

  border:1px solid var(--line);
  border-radius:25px;

  transition:.3s;
}

.process-card:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-sm);
}

.process-no{
  width:58px;
  height:58px;

  margin:0 auto 20px;

  border-radius:50%;

  display:grid;
  place-items:center;

  color:#fff;

  background:linear-gradient(135deg,var(--ink),var(--teal));

  font-family:"Manrope",sans-serif;
  font-weight:800;
}

.process-card h3{
  font-size:17px;
  margin-bottom:7px;
}

.process-card p{
  color:var(--muted);
  font-size:13px;
}

/* ================= APPOINTMENT ================= */

.appointment{
  background:var(--cream);
}

.appointment-wrap{
  max-width:950px;
  margin:auto;

  padding:48px;

  border-radius:34px;

  background:var(--white);
  border:1px solid var(--line);

  box-shadow:var(--shadow);
}

.form-top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;

  margin-bottom:8px;

  font-size:13px;
  font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;

  padding:15px 16px;

  border:1px solid var(--line);
  border-radius:13px;

  background:var(--cream);
  color:var(--ink);

  font-size:14px;

  outline:none;

  transition:.25s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--teal);

  box-shadow:0 0 0 4px rgba(8,127,140,.07);

  background:var(--white);
}

.form-group textarea{
  resize:vertical;
  min-height:120px;
}

.char-count{
  text-align:right;

  color:var(--muted);

  font-size:11px;

  margin-top:5px;
}

.appointment-btn{
  width:100%;

  border:0;

  padding:17px;

  border-radius:14px;

  color:#fff;

  background:linear-gradient(135deg,var(--teal),var(--teal2));

  font-size:15px;
  font-weight:800;

  cursor:pointer;

  box-shadow:0 14px 30px rgba(8,127,140,.18);

  transition:.3s;
}

.appointment-btn:hover{
  transform:translateY(-2px);
}

.appointment-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.status{
  min-height:24px;

  margin-top:15px;

  text-align:center;

  font-weight:700;
  font-size:13px;
}

/* ================= BOOKING SUMMARY ================= */

.booking-summary{
  display:none;

  margin-top:20px;

  padding:18px;

  border-radius:18px;

  background:var(--mint);
  border:1px solid rgba(8,127,140,.12);
}

.booking-summary.show{
  display:block;
}

.booking-summary strong{
  display:block;
  color:var(--teal);
  margin-bottom:5px;
}

/* ================= FAQ ================= */

.faq-section{
  background:var(--white);
}

.faq{
  max-width:850px;
  margin:auto;
}

.faq-item{
  border-bottom:1px solid var(--line);
}

.faq-question{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  padding:21px 0;

  border:0;
  background:none;

  color:var(--ink);

  text-align:left;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.faq-icon{
  font-size:20px;
  color:var(--teal);

  transition:.3s;
}

.faq-answer{
  max-height:0;
  overflow:hidden;

  transition:max-height .35s ease;
}

.faq-answer p{
  color:var(--muted);
  font-size:13px;

  padding:0 40px 20px 0;
}

.faq-item.active .faq-icon{
  transform:rotate(45deg);
}

/* ================= CTA ================= */

.cta{
  max-width:1150px;

  margin:20px auto;

  padding:90px 30px!important;

  text-align:center;

  border-radius:40px;

  color:#fff;

  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.13),transparent 24%),
    radial-gradient(circle at 90% 90%,rgba(255,255,255,.10),transparent 25%),
    linear-gradient(135deg,#102a43,#087f8c);

  box-shadow:0 30px 80px rgba(16,42,67,.16);
}

.cta h2{
  font-size:clamp(34px,5vw,54px);
  line-height:1.1;
  margin-bottom:14px;
}

.cta p{
  color:rgba(255,255,255,.73);
  margin-bottom:30px;
}

.cta .btn{
  background:#fff;
  color:#102a43;
}

/* ================= CONTACT ================= */

.contact{
  background:var(--white);
}

.contact-grid{
  max-width:1080px;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:16px;
}

.contact-card{
  padding:28px;

  border:1px solid var(--line);
  border-radius:21px;

  background:var(--cream);

  transition:.3s;
}

.contact-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow-sm);
}

.contact-card small{
  display:block;

  color:var(--teal);

  font-size:10px;
  font-weight:800;

  letter-spacing:1.5px;
  text-transform:uppercase;

  margin-bottom:7px;
}

.contact-card strong{
  font-size:15px;
}

/* ================= QUICK CONTACT ================= */

.quick-contact{
  max-width:1080px;
  margin:35px auto 0;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:15px;
}

.quick-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  padding:16px;

/* ================= TOAST ================= */

.toast{
  position:fixed;

  left:50%;
  bottom:25px;

  transform:translate(-50%,120px);

  z-index:4000;

  width:min(440px,90%);

  padding:16px 20px;

  border-radius:16px;

  color:#fff;

  box-shadow:0 20px 50px rgba(0,0,0,.20);

  text-align:center;

  font-size:13px;
  font-weight:700;

  opacity:0;

  transition:.4s;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

/* ================= REVEAL ================= */

.reveal{
  opacity:0;
  transform:translateY(25px);
  transition:opacity .7s ease,transform .7s ease;
}

.reveal.visible{
  opacity:1;
  transform:none;
}
